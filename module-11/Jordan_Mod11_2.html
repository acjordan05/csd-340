<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CSD 340 Web Development with HTML and CSS</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f4f7f4;
    text-align:center;
    margin:0;
    padding:40px;
}

h1{
    font-weight:500;
    margin-bottom:30px;
}

.back-link{
    display:block;
    margin-bottom:20px;
    text-decoration:none;
    color:#333;
    font-weight:bold;
}

.container{
    background:white;
    max-width:500px;
    margin:auto;
    padding:30px;
    border-radius:10px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

input{
    padding:10px;
    width:70%;
    border:1px solid #ccc;
    border-radius:6px;
    margin-bottom:15px;
}

button{
    padding:10px 15px;
    margin:5px;
    border:none;
    border-radius:6px;
    color:white;
    cursor:pointer;
}

#addBtn{
    background:#4CAF50;
}

#addBtn:hover{
    background:#3d8f41;
}

#deleteBtn{
    background:#e74c3c;
}

#deleteBtn:hover{
    background:#c0392b;
}

#sortBtn{
    background:#3498db;
}

#sortBtn:hover{
    background:#2c7fb8;
}

#output{
    margin-top:20px;
    text-align:left;
    line-height:1.6;
}

</style>

</head>

<body>

<a class="back-link" href="../index.html">Back to Landing Page</a>

<h1>Assignment 11.2: JavaScript - Part 3</h1>

<div class="container">

<p>Enter a task and press <strong>Add</strong> to add it to your To Do List.</p>

<input type="text" id="taskInput" placeholder="Enter task">

<br>

<button id="addBtn" onclick="addItem()">Add</button>
<button id="deleteBtn" onclick="deleteItem()">Delete Item</button>
<button id="sortBtn" onclick="sortList()">Sort</button>

<div id="output"></div>

</div>

<script>

let todoList = [];

function displayList(){

    let output = "<h3>Things To Do:</h3>";

    for(let i = 0; i < todoList.length; i++){
        output += (i + 1) + ". " + todoList[i] + "<br>";
    }

    document.getElementById("output").innerHTML = output;
}

function addItem(){

    let input = document.getElementById("taskInput").value;

    if(input === ""){
        alert("Please enter a task.");
        return;
    }

    todoList.push(input);

    alert(input + " was added to the list.");

    document.getElementById("taskInput").value = "";

    displayList();
}

function deleteItem(){

    if(todoList.length === 0){
        alert("The list is empty.");
        return;
    }

    let itemNumber = prompt("Enter the number of the item you want to delete:");

    let index = itemNumber - 1;

    if(index >= 0 && index < todoList.length){

        let removed = todoList.splice(index,1);

        alert(removed + " was removed from the list.");

        displayList();

    } else {

        alert("Invalid item number.");

    }
}

function sortList(){

    todoList.sort();

    alert("The list has been sorted.");

    displayList();
}

</script>

</body>
</html>
